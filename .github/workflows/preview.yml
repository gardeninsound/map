name: Preview

# Every pull request gets a link to its own copy of the site, updated on each push:
# https://pr-<number>-garden-preview.gardeninsound.workers.dev
# It's a preview version of the garden-preview Worker (preview/), in the project's Cloudflare
# account. The live site is untouched: it still deploys from main to GitHub Pages.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # the comment with the link
  deployments: write # the "View deployment" button

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Only branches in this repo: a fork's PR doesn't get the Cloudflare token (GitHub's rule),
    # and its code shouldn't run with it anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A "deployment": the PR shows a "View deployment" button with the link (in its timeline and
    # in the merge box), so it's easy to find even when the comment is buried.
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}-garden-preview.gardeninsound.workers.dev
    env:
      URL: https://pr-${{ github.event.pull_request.number }}-garden-preview.gardeninsound.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            preview/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: preview

      - name: Upload the preview
        working-directory: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler versions upload
          --preview-alias "pr-${{ github.event.pull_request.number }}"
          --message "PR #${{ github.event.pull_request.number }} at ${GITHUB_SHA::7}"

      - name: Comment the link
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="**Preview:** $URL

          Updated for ${SHA::7}. It's a full copy of the site: the other rabbits are the real ones, and the idea box files real issues (marked \`[preview pr-$PR]\`)."
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"
