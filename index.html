<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2350" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Garden in Sound</title>
    <meta name="description" content="Walk the streets of West Seattle and find ten years of public propaganda art." />
    <script>
      // GitHub Pages lets browsers cache this page for ~10 min, but every deploy renames the
      // script/style files. A cached copy then points at files that are gone and the map never
      // loads. If that happens, reload once from a fresh URL (which skips the cached page).
      (function () {
        var KEY = 'bearisland-fresh-reload';
        function fresh() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          location.replace(location.pathname + '?fresh=' + Date.now() + location.hash);
        }
        // Only our own build files count. Anything else that fails to load (Cloudflare's
        // analytics beacon, which ad blockers block, or a script an extension adds) is not
        // a stale deploy, and reloading for it would loop.
        function ours(url) {
          try {
            var u = new URL(url, location.href);
            return u.origin === location.origin && u.pathname.indexOf('/assets/') !== -1;
          } catch (e) {
            return false;
          }
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && ours(t.src || t.href)) fresh();
        }, true);
        // a lazily loaded scene whose chunk vanished in a deploy
        window.addEventListener('vite:preloadError', fresh);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
